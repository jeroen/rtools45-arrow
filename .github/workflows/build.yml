name: Build libarrow with Rtools45

on:
  push:
  workflow_dispatch:
    inputs:
      arrow_version:
        description: 'Apache Arrow version'
        default: '25.0.0'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            root: C:\rtools45
          - os: windows-11-arm
            arch: aarch64
            root: C:\rtools45-aarch64
    env:
      ARROW_VERSION: ${{ github.event.inputs.arrow_version || '25.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rtools45
        uses: r-lib/actions/setup-r@v2
        with:
          rtools-version: '45'

      - name: Build libarrow
        shell: pwsh
        env:
          # keep the invoking directory when starting a login shell
          CHERE_INVOKING: 'yes'
          # make the Windows PATH (runner cmake fallback etc) visible in msys2
          MSYS2_PATH_TYPE: inherit
        run: |
          & "${{ matrix.root }}\usr\bin\bash.exe" -l build-arrow.sh
          exit $LASTEXITCODE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libarrow-${{ matrix.arch }}
          path: libarrow-*.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
